<div class="comp-wrap">
  <h1 class="emp page-header">Neuer Plan</h1>
  <form [formGroup]="planForm" (ngSubmit)="submit()">
    <div class="form-row">
      <label for="year">Dienstplan für das Jahr:</label>
      <input id="year" type="number" class="num-entry" formControlName="year">
    </div>
    <hr>
    <h1 class="subtitle">Mitarbeiter</h1>
    <div id="employee">
      <div class="employee-header-row">
        <div>Name</div>
        <div>Übertrag</div>
        <div>Jahresurlaub</div>
      </div>
      <div class="employees-container" formArrayName="employees">
        @for (row of employees.controls; track row; let i = $index) {
        <div class="employee-entry-row" [formGroupName]="i">
          <div class="name-cell">{{ row.get('name')?.value }}</div>
          <input type="number" class="num-entry-small" min="0" formControlName="vacation_days_carryover" />
          <input type="number" class="num-entry-small" min="0" formControlName="vacation_days_total" />
        </div>
        }
      </div>
    </div>
    <div class="button-row">
      <button type="submit" class="button-primary"
        [disabled]="submitting || planForm.invalid || !effectiveDepartmentId">
        Jahresplan erstellen
      </button>
    </div>
  </form>
</div>
