<div class="comp-wrap">
    <h1 class="page-header emp">Modpanel</h1>

    <div id="link-list">
        @if (authService.isAdmin()) {
        <h1 class="subtitle">Fachbereich auswählen</h1>
        <select [ngModel]="selectedDeptId" (ngModelChange)="onSelectDept($event)">
            <option [ngValue]="null">-- Fachbereich --</option>
            @for (d of departments; track d.id) {
            <option [ngValue]="d.id">{{ d.name }}</option>
            }
        </select>
        }

        <h1 class="subtitle">Plandaten verwalten</h1>

        @if (authService.isAdmin()) {
        <a class="card" [routerLink]="canNavigate ? ['/years'] : null"
            [class.disabled]="!canNavigate && authService.isAdmin()">
            Impersonationsmodus
        </a>
        }
        <a class="card" [routerLink]="canNavigate ? ['/mod/employees'] : null"
            [class.disabled]="!canNavigate && authService.isAdmin()">
            Mitarbeiter bearbeiten & anlegen
        </a>

        <a class="card" [routerLink]="canNavigate ? ['/mod/plans'] : null"
            [class.disabled]="!canNavigate && authService.isAdmin()">
            Pläne erstellen
        </a>
    </div>

    <hr>

    <div>
        <h1 class="subtitle">Systemnutzer verwalten</h1>
    </div>
</div>
