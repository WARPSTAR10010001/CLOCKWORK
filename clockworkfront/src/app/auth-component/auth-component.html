<div class="comp-wrap">
  <div class="login-container">
    <div class="login-form">
      <h1 class="emp page-header">Anmeldung</h1>
      @if (theme.getColor() === "soft") {
        <img src="cw-grad-soft.png">
      } @else if (theme.getColor() === "orange") {
        <img src="cw-grad-orange.png">
      } @else {
        <img src="cw-grad.png">
      }
      <input type="text" [(ngModel)]="username" placeholder="Nutzername">
      <input type="password" [(ngModel)]="password" placeholder="Passwort">
      <a class="button-primary" id="login" (click)="login()">Anmelden</a>
      <p (click)="unlockAccess()">Zugang freischalten? / Passwort vergessen?</p>
    </div>
  </div>
</div>
